<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="description" content="AI 輔助健身教練備課與課堂紀錄系統">
  <title>教練備課助手</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header id="app-header">
    <button id="btn-back" class="header-btn" onclick="goBack()" style="display:none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="header-title">今日課程</h1>
    <button id="btn-header-action" class="header-btn" style="display:none"></button>
  </header>

  <!-- Main Content -->
  <main id="app-content"></main>

  <!-- Bottom Navigation -->
  <nav id="bottom-nav">
    <button class="nav-item active" data-view="dashboard" onclick="navigate('dashboard')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>首頁</span>
    </button>
    <button class="nav-item" data-view="students" onclick="navigate('students')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      <span>學員</span>
    </button>
    <button class="nav-item nav-add" onclick="showQuickAction()">
      <div class="nav-add-btn">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
    </button>
    <button class="nav-item" data-view="exercises" onclick="navigate('exercises')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="3" height="10" rx="1"/><rect x="19" y="7" width="3" height="10" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
      <span>動作庫</span>
    </button>
    <button class="nav-item" data-view="history" onclick="navigate('history')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>紀錄</span>
    </button>
  </nav>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Quick Action Sheet -->
  <div id="action-sheet" class="action-sheet" onclick="closeActionSheet(event)">
    <div class="action-sheet-content">
      <div class="action-sheet-handle"></div>
      <h3>快速操作</h3>
      <button class="action-sheet-item" onclick="navigate('add-student'); closeActionSheet();">
        <div class="action-icon" style="background: var(--accent-gradient)">👤</div>
        <div>
          <strong>新增學員</strong>
          <p>建立新的學員資料</p>
        </div>
      </button>
      <button class="action-sheet-item" onclick="startQuickSession(); closeActionSheet();">
        <div class="action-icon" style="background: linear-gradient(135deg, #6c5ce7, #a855f7)">📋</div>
        <div>
          <strong>快速備課</strong>
          <p>選擇學員開始備課</p>
        </div>
      </button>
      <button class="action-sheet-item" onclick="navigate('add-exercise'); closeActionSheet();">
        <div class="action-icon" style="background: linear-gradient(135deg, #f97316, #fbbf24)">🏋️</div>
        <div>
          <strong>新增動作</strong>
          <p>加入動作到模板庫</p>
        </div>
      </button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="data.js"></script>
  <script src="views.js"></script>
  <script src="prep.js"></script>
  <script src="app.js"></script>
</body>
</html>
